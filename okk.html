<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iStop - Task Manager</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container-fluid p-4">
        <!-- Logo -->
        <div class="mb-4">
           <a href="#" class="navbar-brand">
                <img src="1Stop_logo_New.webp" class="img-fluid" alt="logo" width="150">
            </a>
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbar">
                <i class="bi bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbar">
                <div class="navbar-nav ms-auto"></div>
            </div>
        </div>

        <!-- Add Task Button -->
        <div class="mb-3">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                <i class="bi bi-plus-lg me-1"></i>Add Task
            </button>
        </div>

        <!-- Tasks Table -->
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="text-center">#</th>
                            <th scope="col">Task/Description</th>
                            <th scope="col">Responsible</th>
                            <th scope="col">ETA</th>
                            <th scope="col" class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody">
                        <tr id="emptyState">
                            <td colspan="5" class="text-center text-muted py-5">
                                <h5>No Tasks Added yet</h5>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Task Modal -->
    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="taskForm">
                        <div class="mb-3">
                            <label for="taskDescription" class="form-label">Task/Description</label>
                            <input type="text" class="form-control" id="taskDescription" required>
                        </div>
                        <div class="mb-3">
                            <label for="taskResponsible" class="form-label">Responsible</label>
                            <input type="text" class="form-control" id="taskResponsible" required>
                        </div>
                        <div class="mb-3">
                            <label for="taskETA" class="form-label">ETA</label>
                            <input type="date" class="form-control" id="taskETA" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveTaskBtn">Save Task</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal fade" id="editTaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editTaskForm">
                        <input type="hidden" id="editTaskId">
                        <div class="mb-3">
                            <label for="editTaskDescription" class="form-label">Task/Description</label>
                            <input type="text" class="form-control" id="editTaskDescription" required>
                        </div>
                        <div class="mb-3">
                            <label for="editTaskResponsible" class="form-label">Responsible</label>
                            <input type="text" class="form-control" id="editTaskResponsible" required>
                        </div>
                        <div class="mb-3">
                            <label for="editTaskETA" class="form-label">ETA</label>
                            <input type="date" class="form-control" id="editTaskETA" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="updateTaskBtn">Update Task</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Popper.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.min.js"></script>

    <script>
        $(document).ready(function() {
            let tasks = [];
            let addTaskModal = new bootstrap.Modal(document.getElementById('addTaskModal'));
            let editTaskModal = new bootstrap.Modal(document.getElementById('editTaskModal'));

            // Save new task
            $('#saveTaskBtn').click(function() {
                const description = $('#taskDescription').val().trim();
                const responsible = $('#taskResponsible').val().trim();
                const eta = $('#taskETA').val();

                if (description && responsible && eta) {
                    const task = {
                        id: Date.now(),
                        description: description,
                        responsible: responsible,
                        eta: eta
                    };

                    tasks.push(task);
                    renderTasks();
                    
                    // Reset form and close modal
                    $('#taskForm')[0].reset();
                    addTaskModal.hide();
                }
            });

            // Open edit modal
            $(document).on('click', '.edit-btn', function() {
                const taskId = $(this).closest('tr').data('id');
                const task = tasks.find(t => t.id === taskId);
                
                if (task) {
                    $('#editTaskId').val(task.id);
                    $('#editTaskDescription').val(task.description);
                    $('#editTaskResponsible').val(task.responsible);
                    $('#editTaskETA').val(task.eta);
                    editTaskModal.show();
                }
            });

            // Update task
            $('#updateTaskBtn').click(function() {
                const taskId = parseInt($('#editTaskId').val());
                const description = $('#editTaskDescription').val().trim();
                const responsible = $('#editTaskResponsible').val().trim();
                const eta = $('#editTaskETA').val();

                if (description && responsible && eta) {
                    const task = tasks.find(t => t.id === taskId);
                    if (task) {
                        task.description = description;
                        task.responsible = responsible;
                        task.eta = eta;
                        renderTasks();
                        editTaskModal.hide();
                    }
                }
            });

            // Delete task
            $(document).on('click', '.delete-btn', function() {
                if (confirm('Are you sure you want to delete this task?')) {
                    const taskId = $(this).closest('tr').data('id');
                    tasks = tasks.filter(t => t.id !== taskId);
                    renderTasks();
                }
            });

            // Render tasks
            function renderTasks() {
                const tbody = $('#taskTableBody');
                tbody.empty();

                if (tasks.length === 0) {
                    $('#emptyState').show();
                    tbody.append($('#emptyState'));
                } else {
                    tasks.forEach((task, index) => {
                        const formattedDate = new Date(task.eta).toLocaleDateString('en-US', {
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric'
                        });

                        const row = `
                            <tr data-id="${task.id}">
                                <td class="text-center fw-bold">${index + 1}</td>
                                <td>${task.description}</td>
                                <td>${task.responsible}</td>
                                <td>${formattedDate}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary edit-btn me-1">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger delete-btn">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                        tbody.append(row);
                    });
                }
            }

            // Initial render
            renderTasks();
        });
    </script>
</body>
</html>
